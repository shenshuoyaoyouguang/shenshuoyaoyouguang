name: Generate Profile Stats

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate overview stats card
        uses: cicirello/user-statistician@v1
        with:
          image-file: images/profile-stats.svg
          custom-title: GitHub Overview
          colors: dark-dimmed
          hide-keys: languages
          commit-and-push: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: cicirello/user-statistician@v1
        with:
          image-file: images/top-languages.svg
          custom-title: Top Languages
          colors: dark-dimmed
          category-order: languages
          max-languages: 8
          commit-and-push: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine stats into single SVG
        run: |
          node -e "
          const fs = require('fs');
          const stats = fs.readFileSync('images/profile-stats.svg', 'utf8');
          const langs = fs.readFileSync('images/top-languages.svg', 'utf8');
          const targetH = 400;
          const statsScale = targetH / 480;
          const langsScale = targetH / 291;
          const statsW = Math.round(447 * statsScale);
          const langsW = Math.round(410 * langsScale);
          const gap = 20;
          const totalW = statsW + gap + langsW;
          const stripSvg = s => s.replace(/<svg[^>]*>/, '').replace(/<\/svg>$/, '');
          const combined = '<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"' + totalW + '\" height=\"' + targetH + '\" viewBox=\"0 0 ' + totalW + ' ' + targetH + '\">' +
            '<svg x=\"0\" y=\"0\" width=\"' + statsW + '\" height=\"' + targetH + '\" viewBox=\"0 0 447 480\">' + stripSvg(stats) + '</svg>' +
            '<svg x=\"' + (statsW + gap) + '\" y=\"0\" width=\"' + langsW + '\" height=\"' + targetH + '\" viewBox=\"0 0 410 291\">' + stripSvg(langs) + '</svg>' +
            '</svg>';
          fs.writeFileSync('images/github-stats.svg', combined);
          "

      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- images/profile-stats.svg images/top-languages.svg images/github-stats.svg; then
            echo "No image updates to commit."
            exit 0
          fi
          git add images/profile-stats.svg images/top-languages.svg images/github-stats.svg
          git commit -m "chore: refresh profile stats"
          git push
